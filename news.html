<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Column Newspaper View</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .iframe-box {
      flex: 1;
      border: 1px solid #ccc;
      overflow: hidden;
      position: relative;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      transform: scale(0.8); /* Adjust the scale to control "zoom" */
      transform-origin: top left;
    }

    iframe {
      width: 125%; /* Increase width to compensate for scaling */
      height: 125%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="iframe-box">
      <div class="iframe-wrapper">
        <iframe src="https://www.thedailycampus.com" title="Daily Campus"></iframe>
      </div>
    </div>
    <div class="iframe-box">
      <div class="iframe-wrapper">
        <iframe src="https://www.daamardesh.com" title="Amar Desh"></iframe>
      </div>
    </div>
    <div class="iframe-box">
      <div class="iframe-wrapper">
        <iframe src="https://www.prothomalo.com" title="Prothom Alo"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
